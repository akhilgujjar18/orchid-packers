<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bgWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#f8fafc"/>
      <stop offset="60%" stopColor="#f1f5f9"/>
      <stop offset="100%" stopColor="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="carpet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#475569"/>
      <stop offset="40%" stopColor="#334155"/>
      <stop offset="100%" stopColor="#1e293b"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#93c5fd"/>
      <stop offset="60%" stopColor="#bfdbfe"/>
      <stop offset="100%" stopColor="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="shirtNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#1e3a8a"/>
      <stop offset="100%" stopColor="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#d9a86c"/>
      <stop offset="50%" stopColor="#c79153"/>
      <stop offset="100%" stopColor="#ab773e"/>
    </linearGradient>
    <linearGradient id="truckBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#ffffff"/>
      <stop offset="100%" stopColor="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Office Background & Ceiling -->
  <rect width="1200" height="420" fill="url(#bgWall)"/>
  <!-- Ceiling tiles with modern recessed LED panels -->
  <rect width="1200" height="90" fill="#e2e8f0"/>
  <rect x="180" y="20" width="160" height="40" fill="#ffffff" rx="4"/>
  <rect x="420" y="20" width="180" height="40" fill="#ffffff" rx="4"/>
  <rect x="680" y="20" width="180" height="40" fill="#ffffff" rx="4"/>
  <rect x="940" y="20" width="180" height="40" fill="#ffffff" rx="4"/>

  <!-- Left Wall Branding (Official Orchid Packers Wall Murals) -->
  <g transform="translate(60, 110)">
    <!-- Swirl Logo -->
    <circle cx="45" cy="45" r="32" fill="none" stroke="#ea580c" stroke-width="8" stroke-dasharray="140 40"/>
    <polygon points="45,15 70,38 48,34" fill="#0052FF"/>
    <circle cx="45" cy="45" r="16" fill="#0052FF"/>
    <text x="95" y="42" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#0f172a" letter-spacing="0.5">ORCHID</text>
    <text x="95" y="65" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0052FF" letter-spacing="2.5">PACKERS AND MOVERS</text>
    <text x="95" y="82" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ea580c" letter-spacing="1">— Moving Sky —</text>

    <!-- Services list on wall -->
    <g transform="translate(10, 115)" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#334155">
      <circle cx="8" cy="12" r="5" fill="#0052FF"/>
      <text x="24" y="16">Office Relocation</text>
      <circle cx="8" cy="40" r="5" fill="#0052FF"/>
      <text x="24" y="44">Corporate Shifting</text>
      <circle cx="8" cy="68" r="5" fill="#0052FF"/>
      <text x="24" y="72">Safe &amp; Secure</text>
      <circle cx="8" cy="96" r="5" fill="#0052FF"/>
      <text x="24" y="100">On-Time Delivery</text>
    </g>
  </g>

  <!-- Large Glass Panoramic Window on Right side -->
  <g transform="translate(680, 90)">
    <!-- Window Frame -->
    <rect width="480" height="330" fill="url(#skyGrad)" stroke="#cbd5e1" stroke-width="6"/>
    <!-- City High-rise silhouettes -->
    <rect x="40" y="120" width="50" height="210" fill="#94a3b8" opacity="0.6"/>
    <rect x="110" y="80" width="70" height="250" fill="#64748b" opacity="0.5"/>
    <rect x="200" y="140" width="60" height="190" fill="#94a3b8" opacity="0.6"/>
    
    <!-- Orchid Packers Container Moving Truck parked outside -->
    <g transform="translate(140, 160)" filter="url(#shadow)">
      <!-- Truck Container -->
      <rect width="280" height="130" rx="6" fill="url(#truckBody)" stroke="#94a3b8" stroke-width="2"/>
      <rect x="0" y="0" width="8" height="130" fill="#0052FF"/>
      <circle cx="50" cy="50" r="24" fill="none" stroke="#ea580c" stroke-width="6"/>
      <polygon points="50,28 68,44 52,41" fill="#0052FF"/>
      <text x="85" y="48" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#0f172a">ORCHID</text>
      <text x="85" y="66" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#0052FF">PACKERS AND MOVERS</text>
      <text x="85" y="80" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#ea580c">— Moving Sky —</text>
      <!-- Truck Cabin -->
      <polygon points="280,50 320,80 320,130 280,130" fill="#0052FF"/>
      <!-- Wheels -->
      <circle cx="60" cy="135" r="16" fill="#0f172a"/>
      <circle cx="240" cy="135" r="16" fill="#0f172a"/>
      <circle cx="300" cy="135" r="16" fill="#0f172a"/>
    </g>
    <!-- Window divider lines -->
    <line x1="160" y1="0" x2="160" y2="330" stroke="#cbd5e1" stroke-width="6"/>
    <line x1="320" y1="0" x2="320" y2="330" stroke="#cbd5e1" stroke-width="6"/>
  </g>

  <!-- Carpet Tile Flooring -->
  <rect y="420" width="1200" height="260" fill="url(#carpet)"/>
  <!-- Carpet tile texture lines -->
  <line x1="0" y1="500" x2="1200" y2="500" stroke="#64748b" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="0" y1="580" x2="1200" y2="580" stroke="#64748b" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="200" y1="420" x2="200" y2="680" stroke="#64748b" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="500" y1="420" x2="500" y2="680" stroke="#64748b" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="800" y1="420" x2="800" y2="680" stroke="#64748b" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1050" y1="420" x2="1050" y2="680" stroke="#64748b" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Left: Workstation Desk with Monitor & Ergonomic Chair wrapped in stretch film -->
  <g transform="translate(140, 360)">
    <!-- Desk table -->
    <rect x="0" y="50" width="280" height="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <rect x="20" y="70" width="12" height="150" fill="#64748b"/>
    <rect x="250" y="70" width="12" height="150" fill="#64748b"/>
    <!-- Desktop PC Monitor with protective bubble wrap -->
    <rect x="80" y="-30" width="110" height="75" rx="4" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="128" y="45" width="14" height="15" fill="#334155"/>
    <rect x="110" y="58" width="50" height="6" rx="2" fill="#475569"/>

    <!-- Ergonomic Office Chair being wrapped in clear stretch film -->
    <g transform="translate(-60, 40)" filter="url(#shadow)">
      <!-- Chair base & wheels -->
      <circle cx="70" cy="180" r="6" fill="#0f172a"/>
      <circle cx="30" cy="180" r="6" fill="#0f172a"/>
      <circle cx="110" cy="180" r="6" fill="#0f172a"/>
      <line x1="30" y1="180" x2="110" y2="180" stroke="#0f172a" stroke-width="4"/>
      <rect x="67" y="130" width="6" height="50" fill="#0f172a"/>
      <!-- Mesh Seat & Backrest -->
      <rect x="25" y="105" width="90" height="25" rx="6" fill="#1e293b"/>
      <rect x="35" y="20" width="70" height="90" rx="10" fill="#1e293b"/>
      <!-- Stretch Film Wrapping Layers (semi-transparent clear plastic) -->
      <rect x="20" y="15" width="100" height="120" rx="12" fill="#e0f2fe" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="20" y1="45" x2="120" y2="45" stroke="#bae6fd" stroke-width="2" stroke-dasharray="8 4"/>
      <line x1="20" y1="85" x2="120" y2="85" stroke="#bae6fd" stroke-width="2" stroke-dasharray="8 4"/>
      <!-- Orchid Security Tape on Chair -->
      <rect x="18" y="60" width="104" height="14" fill="#ea580c"/>
      <text x="70" y="70" font-family="system-ui, sans-serif" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle">ORCHID PACKERS · SECURE</text>
    </g>
  </g>

  <!-- Crew Member 1: Kneeling / Wrapping Chair (Navy polo with Orchid logo) -->
  <g transform="translate(100, 260)" filter="url(#shadow)">
    <!-- Back of shirt -->
    <path d="M70,70 Q110,60 150,70 L170,190 Q110,210 50,190 Z" fill="url(#shirtNavy)"/>
    <!-- Orange sleeve trim -->
    <ellipse cx="60" cy="180" rx="12" ry="8" fill="#ea580c"/>
    <ellipse cx="160" cy="180" rx="12" ry="8" fill="#ea580c"/>
    <!-- Head / hair -->
    <circle cx="110" cy="45" r="26" fill="#1c1917"/>
    <!-- Pants -->
    <rect x="60" y="190" width="100" height="130" rx="10" fill="#0f172a"/>
    <!-- Orchid Logo printed on back of polo -->
    <g transform="translate(85, 100)">
      <circle cx="25" cy="18" r="14" fill="none" stroke="#ea580c" stroke-width="4"/>
      <polygon points="25,8 35,16 27,15" fill="#ffffff"/>
      <text x="25" y="38" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">ORCHID</text>
      <text x="25" y="47" font-family="system-ui, sans-serif" font-size="6" font-weight="800" fill="#93c5fd" text-anchor="middle">PACKERS AND MOVERS</text>
      <text x="25" y="55" font-family="system-ui, sans-serif" font-size="5" font-weight="700" fill="#fb923c" text-anchor="middle">— Moving Sky —</text>
    </g>
  </g>

  <!-- Center Crew Member 2: Carrying Moving Carton through the office hallway -->
  <g transform="translate(680, 240)" filter="url(#shadow)">
    <!-- Mover Back Profile -->
    <path d="M50,70 Q85,55 120,70 L135,190 Q85,200 40,190 Z" fill="url(#shirtNavy)"/>
    <!-- Orange collar / sleeve trim -->
    <ellipse cx="40" cy="170" rx="10" ry="7" fill="#ea580c"/>
    <ellipse cx="130" cy="170" rx="10" ry="7" fill="#ea580c"/>
    <!-- Head -->
    <circle cx="85" cy="40" r="24" fill="#1c1917"/>
    <!-- Trousers / legs -->
    <rect x="50" y="190" width="30" height="150" fill="#0f172a"/>
    <rect x="90" y="190" width="30" height="150" fill="#0f172a"/>
    <!-- Shoes -->
    <rect x="45" y="335" width="40" height="16" rx="4" fill="#000000"/>
    <rect x="85" y="335" width="40" height="16" rx="4" fill="#000000"/>
    <!-- Logo on shirt back -->
    <g transform="translate(65, 95)">
      <circle cx="20" cy="15" r="12" fill="none" stroke="#ea580c" stroke-width="3"/>
      <text x="20" y="34" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">ORCHID</text>
      <text x="20" y="42" font-family="system-ui, sans-serif" font-size="5" font-weight="800" fill="#93c5fd" text-anchor="middle">PACKERS AND MOVERS</text>
    </g>
    <!-- Moving Box in hands -->
    <g transform="translate(110, 110)">
      <rect width="110" height="85" rx="4" fill="url(#boxGrad)" stroke="#8d5b27" stroke-width="1.5"/>
      <rect x="0" y="35" width="110" height="12" fill="#ea580c"/>
      <!-- Orchid Logo on Carton -->
      <circle cx="30" cy="20" r="10" fill="none" stroke="#0052FF" stroke-width="2.5"/>
      <text x="50" y="18" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#0f172a">ORCHID</text>
      <text x="50" y="26" font-family="system-ui, sans-serif" font-size="5" font-weight="800" fill="#ea580c">PACKERS</text>
    </g>
  </g>

  <!-- Foreground Stacks of Official Orchid Moving Cartons -->
  <g transform="translate(480, 420)" filter="url(#shadow)">
    <!-- Bottom Large Box -->
    <rect width="190" height="120" rx="4" fill="url(#boxGrad)" stroke="#8d5b27" stroke-width="2"/>
    <rect x="0" y="50" width="190" height="16" fill="#ea580c"/>
    <text x="95" y="62" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">OFFICE IT ASSETS · ZERO DOWNTIME</text>
    <circle cx="45" cy="30" r="16" fill="none" stroke="#0052FF" stroke-width="4"/>
    <polygon points="45,18 56,26 47,25" fill="#ea580c"/>
    <text x="75" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#0f172a">ORCHID</text>
    <text x="75" y="40" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#0052FF">PACKERS AND MOVERS</text>

    <!-- Top Stacked Box -->
    <g transform="translate(15, -95)">
      <rect width="160" height="100" rx="4" fill="url(#boxGrad)" stroke="#8d5b27" stroke-width="2"/>
      <rect x="0" y="40" width="160" height="14" fill="#ea580c"/>
      <circle cx="35" cy="24" r="14" fill="none" stroke="#0052FF" stroke-width="3"/>
      <text x="60" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#0f172a">ORCHID</text>
      <text x="60" y="32" font-family="system-ui, sans-serif" font-size="7" font-weight="800" fill="#0052FF">PACKERS</text>
      <!-- Fragile Server stamp -->
      <rect x="100" y="60" width="50" height="24" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
      <text x="125" y="75" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#b91c1c" text-anchor="middle">CONFIDENTIAL</text>
    </g>
  </g>

  <!-- Right: IT Server Rack on Wheels wrapped in protective film -->
  <g transform="translate(940, 310)" filter="url(#shadow)">
    <!-- Rack body -->
    <rect width="180" height="250" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
    <!-- Mesh door slats -->
    <line x1="30" y1="40" x2="150" y2="40" stroke="#475569" stroke-width="3"/>
    <line x1="30" y1="70" x2="150" y2="70" stroke="#475569" stroke-width="3"/>
    <line x1="30" y1="100" x2="150" y2="100" stroke="#475569" stroke-width="3"/>
    <line x1="30" y1="130" x2="150" y2="130" stroke="#475569" stroke-width="3"/>
    <line x1="30" y1="160" x2="150" y2="160" stroke="#475569" stroke-width="3"/>
    <line x1="30" y1="190" x2="150" y2="190" stroke="#475569" stroke-width="3"/>
    <line x1="30" y1="220" x2="150" y2="220" stroke="#475569" stroke-width="3"/>
    <!-- Clear stretch wrap encasing the server cart -->
    <rect x="-6" y="-6" width="192" height="262" rx="10" fill="#bae6fd" fill-opacity="0.35" stroke="#38bdf8" stroke-width="2"/>
    <!-- Yellow Caution ESD Label -->
    <rect x="25" y="80" width="130" height="34" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="90" y="96" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#854d0e" text-anchor="middle">PUNE TECH PARK SERVER</text>
    <text x="90" y="108" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#0f172a" text-anchor="middle">ANTI-STATIC ESD SHIELDED</text>
    <!-- Heavy Duty Castor Wheels -->
    <circle cx="35" cy="265" r="14" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <circle cx="145" cy="265" r="14" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
  </g>
</svg>
